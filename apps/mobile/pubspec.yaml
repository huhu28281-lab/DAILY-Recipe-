name: smart_meal_planner
description: "일주일 아침·저녁 식단을 자동으로 짜주는 가정용 앱 (명세 v1.2)"
publish_to: "none"
version: 1.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^2.6.1

  # 라우팅 (탭1 식단 캘린더 · 탭2 식재료 · 탭3 리포트 · 탭4 가족)
  go_router: ^14.6.2

  # 백엔드(Cloudflare Workers) 통신
  dio: ^5.7.0

  # 숫자/통화 포맷 ("약 9,800원" 백 원 단위 반올림, §2.4)
  intl: ^0.19.0

  # 민감정보(알레르기·식이 목표) 단말 로컬 저장 (§8)
  shared_preferences: ^2.3.3

  # 생성 중 화면 Lottie 애니메이션, Reduce Motion 시 정지 이미지로 대체 (§9.4)
  lottie: ^3.1.3

  # §7 데이터 계약 모델 (freezed/json_serializable 생성 코드가 참조하는 런타임 어노테이션)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

  assets:
    - assets/images/
    - assets/lottie/
