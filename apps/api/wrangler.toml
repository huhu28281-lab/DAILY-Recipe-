name = "smart-meal-planner-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# --- 환경 변수 (비밀값 아님) ---
[vars]
ENVIRONMENT = "development"
PRICE_REFERENCE_SOURCE = "KAMIS"
SWAP_WEEKLY_LIMIT = "20"

# --- D1: 재료 마스터 / 알레르기 마스터 / 영양성분 / 가격 참조 / 주간 식단 이력 ---
# 실제 database_id는 `wrangler d1 create smart-meal-planner-db` 실행 후 채운다.
[[d1_databases]]
binding = "DB"
database_name = "smart-meal-planner-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "src/db/migrations"

# --- KV: 생성 파이프라인 캐시(제철 재료, 가격 배치 스냅샷 등) ---
[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# --- Cron: KAMIS/aT 가격 DB 주 1회 배치 갱신 (§2.4) ---
# 매주 일요일 04:00 UTC = 월요일 13:00 KST
[triggers]
crons = ["0 4 * * 0"]

# --- 시크릿은 여기 두지 않는다 ---
# wrangler secret put LLM_API_KEY
# wrangler secret put KAMIS_API_KEY
# wrangler secret put AT_API_KEY
# 로컬 개발용은 .dev.vars (커밋 금지, .dev.vars.example 참고)
